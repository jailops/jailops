# GoReleaser: the release archives and the Linux packages. The FreeBSD packages (pkg) are made by
# scripts/pkg-build.sh on FreeBSD (GoReleaser cannot make them), see packaging/pkg/README.md and
# .github/workflows/release.yml.
#
#   goreleaser release --snapshot --clean      a local trial, publishes nothing
version: 2
project_name: jailops

before:
  hooks:
    # the consoles are embedded in the binaries
    - go run ./scripts/gen-ts -check
    - sh -c 'cd web && npm ci && npm run build:all'

builds:
  - id: jailops
    main: ./cmd/jailops
    binary: jailops
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
  - id: jailops-sync
    main: ./cmd/jailops-sync
    binary: jailops-sync
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
  - id: jailopsd
    main: ./cmd/jailopsd
    binary: jailopsd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [freebsd]
    goarch: [amd64, arm64]
  - id: jailops-priv
    main: ./cmd/jailops-priv
    binary: jailops-priv
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [freebsd]
    goarch: [amd64, arm64]
  - id: jailops-backupd
    main: ./cmd/jailops-backupd
    binary: jailops-backupd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, freebsd]
    goarch: [amd64, arm64]

# Every build is static (CGO_ENABLED=0 below) and stamped with `-X main.version={{ .Version }}` by GoReleaser's
# default ldflags. -trimpath keeps the build host's paths out of the binaries.

archives:
  - id: client
    ids: [jailops, jailops-sync]
    name_template: "jailops-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE.md, README.md]
  - id: host
    ids: [jailopsd, jailops-priv]
    name_template: "jailops-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE.md
      - README.md
      - src: packaging/rc.d/*
        dst: rc.d
      - src: packaging/jailopsd.yaml
        dst: etc/jailopsd.yaml.sample
      - src: packaging/priv.conf.sample
        dst: etc/priv.conf.sample
  - id: backupd
    ids: [jailops-backupd]
    name_template: "jailops-backupd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE.md
      - src: packaging/backupd.yaml
        dst: etc/backupd.yaml.sample
      - src: packaging/rc.d/jailops_backupd
        dst: rc.d/jailops_backupd
      - src: packaging/systemd/jailops-backupd.service
        dst: systemd/jailops-backupd.service

nfpms:
  - id: jailops-client
    package_name: jailops-client
    ids: [jailops, jailops-sync]
    formats: [deb, rpm, apk]
    vendor: JailOps
    homepage: https://jailops.net
    maintainer: JailOps <packages@jailops.net>
    description: The jailops command line client and jailops-sync, the declarative fleet tool.
    license: BSD-2-Clause
    bindir: /usr/bin
  - id: jailops-backupd
    package_name: jailops-backupd
    ids: [jailops-backupd]
    formats: [deb, rpm, apk]
    vendor: JailOps
    homepage: https://jailops.net
    maintainer: JailOps <packages@jailops.net>
    description: The JailOps backup node. It stores encrypted, deduplicated backups, holds no key and needs PostgreSQL for its control plane.
    license: BSD-2-Clause
    bindir: /usr/bin
    contents:
      - src: packaging/backupd.yaml
        dst: /etc/jailops/backupd.yaml
        type: config|noreplace
        file_info: {mode: 0640, owner: root, group: jailops-backup}
      - src: packaging/systemd/jailops-backupd.service
        dst: /lib/systemd/system/jailops-backupd.service
        file_info: {mode: 0644}
    scripts:
      preinstall: packaging/linux-backupd-preinstall.sh
    overrides:
      deb:
        dependencies: [adduser]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^ci:']

release:
  github:
    owner: jailops
    name: jailops
  prerelease: auto
  header: |
    JailOps is pre-release software: it has not been security audited. FreeBSD packages are published at
    https://pkg.jailops.net (see packaging/pkg/README.md); these archives hold the same binaries.
