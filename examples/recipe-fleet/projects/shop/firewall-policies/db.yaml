apiVersion: jailops/v1
kind: FirewallPolicy
metadata:
  name: db
spec:
  default_in: deny
  default_out: allow
  rules:
    # Only the web jail reaches PostgreSQL. A rule that names a jail is fine before the jail exists: it matches nobody until then.
    - {name: from-web, action: allow, direction: in, proto: tcp, ports: ["5432"], from: ["jail:web"]}
