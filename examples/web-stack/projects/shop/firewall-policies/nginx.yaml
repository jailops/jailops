apiVersion: jailops/v1
kind: FirewallPolicy
metadata:
  name: nginx
spec:
  default_in: deny
  default_out: allow
  rules:
    - {name: https, action: allow, direction: in, proto: tcp, ports: ["80", "443"]}
    - {name: ssh-admins, action: allow, direction: in, proto: tcp, ports: ["22"], from: ["@admins"]}
