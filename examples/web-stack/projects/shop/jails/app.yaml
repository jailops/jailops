apiVersion: jailops/v1
kind: Jail
hosts: [app1]
start: true
metadata:
  name: app
  labels: {tier: app, backup: nightly}
spec:
  image: freebsd-15@stable
  storage: default
  network:
    - {name: eth0, network: shop, ipv4: "10.60.0.20"}
  firewall: {policy: app}
  resources: {cpu: 2, memory: 2G}
  boot: {autostart: true, priority: 20, depends: [postgres]}
  env:
    APP_ENV: production
    # A value of shared/secrets.sops.yaml. Sync decrypts it in memory when it applies, seals it to the host's own
    # age key and sends it sealed; the API never returns it and the repository holds only ciphertext.
    DB_PASSWORD: secret:db.password
