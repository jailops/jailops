apiVersion: jailops/v1
kind: Jail
hosts: [app1]
start: true
metadata:
  name: nginx
  labels: {tier: web}
spec:
  image: freebsd-15
  storage: default
  network:
    - {name: eth0, network: shop, ipv4: "10.60.0.10"}
  firewall: {policies: [nginx]}
  resources: {cpu: 1, memory: 512M}
  boot: {autostart: true, priority: 30, depends: [app]}
  expose:
    - {ports: ["80", "443"], comment: web}
