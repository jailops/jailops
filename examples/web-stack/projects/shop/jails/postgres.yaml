apiVersion: jailops/v1
kind: Jail
hosts: [app1]
start: true
metadata:
  name: postgres
  labels: {tier: db, backup: nightly}
spec:
  image: freebsd-15@stable
  storage: default
  network:
    - {name: eth0, network: shop, ipv4: "10.60.0.30"}
  firewall: {policy: postgres}
  resources: {cpu: 2, memory: 4G, disk: 100G}
  boot: {autostart: true, priority: 10}
  volumes:
    # The database lives in its own dataset: snapshotted, rolled back and backed up with the jail, and untouched
    # when the OS root is replaced by an image update.
    - {name: data, mount: /var/db/postgres, quota: 50G}
  env:
    POSTGRES_PASSWORD: secret:db.password
  provision:
    packages: [postgresql17-server]
    services: {enable: [postgresql]}
    commands:
      - [service, postgresql, initdb]
      - [service, postgresql, start]
