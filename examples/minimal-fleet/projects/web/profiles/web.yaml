apiVersion: jailops/v1
kind: Profile
metadata:
  name: web
spec:
  # Project profile: only jails of project web can list it. It carries the
  # project's network and storage, so a jail only has to list the profile.
  network:
    - {name: eth0, network: br-web, ipv4: auto}
  storage: fast
  firewall: {policy: base}
  proxy:
    - {name: http, listen: ":80", jail_port: 80}
    - {name: https, listen: ":443", jail_port: 443}
