apiVersion: jailops/v1
kind: FirewallPolicy
metadata:
  name: base
spec:
  # The project's mandatory policy: rendered before every jail's own policy.
  default_in: deny
  default_out: allow
  rules:
    - {name: ssh-office, action: allow, direction: in, proto: tcp, ports: ["22"], from: ["203.0.113.0/28"]}
