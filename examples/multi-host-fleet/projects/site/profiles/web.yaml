apiVersion: jailops/v1
kind: Profile
metadata:
  name: web
spec:
  # A project profile: it carries the project's network, storage and firewall so a jail only lists the profile.
  image: freebsd-15@stable
  storage: default
  network:
    - {name: eth0, network: web, ipv4: auto}
  firewall: {policy: web}
  proxy:
    - {name: https, listen: ":443", jail_port: 443}
