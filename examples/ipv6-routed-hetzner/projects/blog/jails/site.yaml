apiVersion: jailops/v1
kind: Jail
hosts: [hz1]
start: true
metadata:
  name: site
spec:
  image: freebsd-15@stable
  storage: default
  network:
    - {name: eth0, network: blog, ipv4: auto, ipv6: "2001:db8:abcd:1:1::80"}
  firewall: {policy: web}
  resources: {cpu: 1, memory: 1G}
  proxy:
    - {name: http, listen: ":80", jail_port: 80}
    - {name: https, listen: ":443", jail_port: 443}
