apiVersion: jailops/v1
kind: Jail
hosts: [self]
start: true
metadata:
  name: web
spec:
  image: freebsd-15@stable
  storage: default
  network: [{name: eth0, network: lan, ipv4: auto}]
  firewall: {policy: web}
  resources: {memory: 512M}
  proxy: [{name: http, listen: ":80", jail_port: 80}]
  provision:
    packages: [nginx]
    services: {enable: [nginx], start: [nginx]}
