apiVersion: jailops/v1
kind: Jail
hosts: [self]
start: true
metadata:
  name: hello
spec:
  image: freebsd-15@stable
  storage: default
  network: [{name: eth0, network: apps, ipv4: auto}]
  firewall: {policy: hello}
  resources: {memory: 256M}
  proxy: [{name: hello, listen: ":8099", jail_port: 8099}]
  # Runs once, at the jail's first start (or `jailops provision hello --again`). Order inside provision is fixed:
  # packages, files, services, commands. Installing from a private repository needs the repository's configuration in the
  # jail BEFORE `pkg install`, and `packages:` runs before `files:`, so everything that touches the repository is a command.
  provision:
    files:
      # Sources are files of the project on the HOST: <state_dir>/project-files/apps/ (see the README); sync does not ship them.
      - {source: pkg/hello.conf, destination: /usr/local/etc/pkg/repos/hello.conf, mode: "0644"}
      - {source: pkg/hello.pub, destination: /usr/local/etc/pkg/keys/hello.pub, mode: "0644"}
    commands:
      - [pkg, update, -f]
      - [pkg, install, -y, hello]
      - [sysrc, "hello_flags=-listen 0.0.0.0:8099"]
      - [sysrc, hello_enable=YES]
      - [service, hello, start]
