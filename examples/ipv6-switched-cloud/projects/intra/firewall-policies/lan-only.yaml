apiVersion: jailops/v1
kind: FirewallPolicy
metadata:
  name: lan-only
spec:
  default_in: deny
  default_out: allow
  rules:
    - {name: wiki, action: allow, direction: in, proto: tcp, ports: ["3000"], from: ["@admins"]}
    - {name: ssh-admins, action: allow, direction: in, proto: tcp, ports: ["22"], from: ["@admins"]}
