apiVersion: jailops/v1
kind: Jail
hosts: [cloud1]
start: true
metadata:
  name: web
  labels: {tier: web}
spec:
  image: freebsd-15@stable
  storage: default            # a jail names its storage and its network; nothing is filled in
  network:
    - name: eth0
      network: shop
      ipv4: "10.94.0.10"
      # A fixed IPv6 address inside the network's range: this is the address your AAAA record points at.
      ipv6: "2001:db8:1:2:100::80"
  firewall: {policy: public-web}
  resources: {cpu: 2, memory: 1G, pids: 500}
  boot: {autostart: true, priority: 10}
  update: {strategy: rebase, mode: notify, schedule: "0 4 * * 0", packages: true, os: true}
  proxy:
    # IPv4 is NATed: forward the host's ports 80 and 443 to the jail. IPv6 needs no forwarding.
    - {name: http, listen: ":80", jail_port: 80}
    - {name: https, listen: ":443", jail_port: 443}
  provision:
    packages: [nginx]
    services: {enable: [nginx], start: [nginx]}
