apiVersion: jailops/v1
kind: Jail
hosts: [cloud1]
start: true
metadata:
  name: app
  labels: {tier: app}
spec:
  image: freebsd-15@stable
  storage: default
  network:
    - {name: eth0, network: shop, ipv4: auto, ipv6: auto}
  firewall: {policy: app-private}
  resources: {cpu: 2, memory: 2G}
  boot: {autostart: true, priority: 20, depends: [web]}
