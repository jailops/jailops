apiVersion: jailops/v1
kind: Project
metadata:
  name: shop
spec:
  description: The public shop. Its web jail is reachable from the internet over IPv6.
  hosts: [cloud1]
  networks:
    - {network: shop}
  storage:
    - {storage: default, quota: 200G}
  quotas: {jails: 10, memory: 16G, addresses: 50}
  # The floor: rendered before every jail's own policy. A jail can add rules but cannot weaken this.
  firewall: floor
  images: [freebsd-15]
