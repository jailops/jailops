name: CI mirror rerun

# The FreeBSD VMs of CI read the package mirror for what their image lacks. A mirror that does not answer ends the prepare step of a
# VM job with the line "the package mirror ... did not give ... in three attempts". This workflow runs the failed jobs of a CI run once
# more when EVERY failed job of it (CI ok aside) ended with that line: a mirror outage is not a verdict on the code, and a failure of
# a test never is retried (a run with one failed test and one failed mirror is left alone). It acts on the first attempt only, so a
# run is retried at most once, and only for runs of this repository. It runs no code of the run and uses no action: the token reads
# the job logs and starts the rerun, nothing else.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: Rerun the jobs that lost against the package mirror
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look at the failed jobs, rerun them when only the mirror failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"')
          [ -n "$jobs" ] || { echo "no failed job: nothing to do"; exit 0; }
          mirror=0; other=0
          while IFS="$(printf '\t')" read -r id name; do
            [ "$name" = "CI ok" ] && continue
            if gh run view "$RUN" -R "$REPO" --job "$id" --log 2>/dev/null \
              | grep -Eq 'the package mirror .* did not give .* in three attempts'; then
              mirror=$((mirror + 1)); echo "mirror: $name"
            else
              other=$((other + 1)); echo "not the mirror: $name"
            fi
          done <<EOF
          $jobs
          EOF
          if [ "$mirror" -gt 0 ] && [ "$other" -eq 0 ]; then
            echo "every failed job lost against the package mirror: rerunning the failed jobs once"
            gh run rerun "$RUN" -R "$REPO" --failed
          else
            echo "not rerun: $mirror lost against the mirror, $other failed for another reason"
          fi
