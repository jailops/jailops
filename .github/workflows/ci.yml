name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The same suite every night with longer fuzzing: the parsers get minutes, not seconds.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# the Go jobs always get the built consoles: a test fails when one is missing from the binary
env:
  JAILOPS_REQUIRE_CONSOLE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The consoles are embedded in the binaries, so they are built first and handed to the Go jobs. Only the build blocks
  # them: the type checks, the unit tests and the Playwright tests run beside the Go jobs in web-test and web-e2e.
  web-build:
    name: Web consoles (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build both consoles
        run: |
          cd web
          npm ci
          npm run build:all
      # one tar file: with several paths upload-artifact roots them at their common parent, and they would unpack to
      # webui/dist instead of internal/webui/dist
      - name: Pack the built consoles
        run: tar -cf "$RUNNER_TEMP/console-dist.tar" internal/webui/dist internal/backupui/dist
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: ${{ runner.temp }}/console-dist.tar
          compression-level: 0
          retention-days: 7

  web-test:
    name: Web consoles (types, unit tests)
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, unit tests
        run: |
          cd web
          npm ci
          npm run typecheck
          npm run test:all

  # The end-to-end tests of the consoles in a real Chromium, in demo mode. Playwright installs the browser with its system
  # libraries and fonts (apt), with a quick mirror, retries and the downloaded packages kept between runs.
  web-e2e:
    name: Web consoles (end-to-end, Chromium)
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the end-to-end tests run `vite preview` on the built consoles (web/host/playwright.config.ts: "build first")
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      # The runner's apt mirror (azure.archive.ubuntu.com) is sometimes served by a node that trickles at tens of KB/s for
      # hours (actions/runner-images#14823): apt's own timeout only covers a stalled connection, never a slow one. So the
      # mirror is chosen by measuring: a 5 second download of the package index from each of three public mirrors, and the
      # fastest goes first in the list apt reads, the others stay as fallbacks. A download that stalls for 10 seconds is
      # dropped and apt moves to the next mirror; failed downloads are retried.
      - name: Fastest apt mirror, retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo chown -R "$USER" /var/cache/apt/archives
          list=/etc/apt/apt-mirrors.txt
          [ -f "$list" ] || exit 0
          . /etc/os-release
          mirrors="http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu"
          best=""; bestspeed=0
          for m in $mirrors; do
            speed=$(curl -s -o /dev/null -w '%{speed_download}' --max-time 5 "$m/dists/$VERSION_CODENAME/main/binary-amd64/Packages.gz" || true)
            speed=${speed%%.*}
            echo "mirror $m: $(( ${speed:-0} / 1024 )) KB/s"
            if [ "${speed:-0}" -gt "$bestspeed" ]; then best=$m; bestspeed=$speed; fi
          done
          [ -n "$best" ] || exit 0
          { echo "$best priority:1"; for m in $mirrors; do [ "$m" = "$best" ] || echo "$m priority:2"; done; } | sudo tee "$list" >/dev/null
          echo "using $best"
      - name: Cache the apt packages and the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1-${{ hashFiles('web/package-lock.json') }}
      - name: End-to-end tests (demo mode, real Chromium)
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e:all

  lint:
    name: Go (format, vet, build, types, SDK)
    needs: web-build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: No binaries in git
        run: sh scripts/no-binaries.sh
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal sdk scripts)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Every command takes its version from -X main.version (a command without it ships as "dev")
        run: |
          for d in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            grep -q '^var version = ' "cmd/$d/main.go" || { echo "cmd/$d/main.go has no 'var version': the release stamp would not reach it"; exit 1; }
          done
      - run: go vet ./...
      - run: go build ./...
      - name: Wire types are current
        run: go run ./scripts/gen-ts -check
      - name: The race shards cover every package exactly once
        run: bash scripts/ci-race.sh --check
      - name: SDK module (stdlib only, outside the go.work workspace so that only its own go.mod counts)
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          CGO_ENABLED=1 go test ./... -race -count=1
          test -z "$(go list -m all | tail -n +2)" || { echo "the SDK must have no dependencies"; go list -m all; exit 1; }

  # Fuzzing beside the other Go jobs (go allows one fuzz target per run; longer on the nightly run).
  fuzz:
    name: Go fuzz
    needs: web-build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: Fuzz the parsers
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '90s' || '5s' }}
        run: |
          for f in $(go test ./internal/sys/zfs -list '^Fuzz' | grep '^Fuzz'); do
            go test ./internal/sys/zfs -run '^$' -fuzz "^${f}\$" -fuzztime "$FUZZ_TIME"
          done
      - name: Fuzz the helper's command allow-list
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '5m' || '20s' }}
        run: go test ./internal/priv -run '^$' -fuzz '^FuzzCheckCommand$' -fuzztime "$FUZZ_TIME"

  # The tests with the race detector, in four parallel shards (scripts/ci-race.sh: split by measured run time).
  race:
    name: Go race detector (${{ matrix.shard }})
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, rest]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JAILOPS_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: go test -race (shard ${{ matrix.shard }})
        run: bash scripts/ci-race.sh ${{ matrix.shard }}

  cross:
    name: Cross-build (FreeBSD)
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: freebsd
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - run: go vet ./...   # compiles everything, so no separate go build
      - name: Binaries
        run: |
          mkdir -p dist
          for b in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            go build -trimpath -ldflags="-s -w -X main.version=$(tr -d '[:space:]' < version.txt)" -o dist/$b-freebsd-${{ matrix.arch }} ./cmd/$b
          done
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.arch }}
          path: dist
          retention-days: 7

  # The tests on the real target. A FreeBSD VM runs the unit tests natively (pty, jail(2), sysctl and the other
  # FreeBSD-only code paths execute here, not just compile) and then the scripted end-to-end flow on a file-backed
  # ZFS pool: image build, jail create/start/exec, backup to a node and restore.
  # Three VMs side by side: the Go tests on real FreeBSD, the product end to end, and the packet filter test with real
  # traffic (scripts/ci-freebsd-e2e.sh, JAILOPS_E2E_PART). They do not depend on each other, so the run takes the
  # longest one, not the sum.
  freebsd:
    name: FreeBSD VM (${{ matrix.part }})
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [go, e2e, pf]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      # The e2e and pf VMs get the binaries built here (cross-compiled in about a minute) instead of building them inside the VM, and
      # the forged-frame tool for phase 0e of the PF matrix.
      - uses: actions/setup-go@v7
        if: matrix.part != 'go'
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        if: matrix.part != 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - name: Build the binaries for the e2e VM
        if: matrix.part != 'go'
        env:
          CGO_ENABLED: "0"
          GOOS: freebsd
          GOARCH: amd64
        run: |
          mkdir -p vm-bin
          for b in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            go build -trimpath -ldflags="-s -w -X main.version=$(tr -d '[:space:]' < version.txt)" -o vm-bin/$b-freebsd-amd64 ./cmd/$b
          done
          go build -o vm-bin/forge-freebsd-amd64 ./scripts/forge
      - name: KVM must be there (without it QEMU falls back to software emulation, which is far too slow)
        run: |
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner: the VM would run on TCG"; exit 1; }
          nproc; ls -l /dev/kvm
      - uses: vmactions/freebsd-vm@v1
        env:
          PART: ${{ matrix.part }}
        with:
          envs: PART JAILOPS_REQUIRE_CONSOLE
          cache-after-prepare: true
          release: "15.1"
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y go git-lite postgresql17-server bash curl rsync
          run: |
            set -eu
            # go.mod names a newer Go than the package: fetch it; the tests that build binaries must not ask git for a
            # VCS stamp (the synced tree is not a clone)
            export CGO_ENABLED=0 GOTOOLCHAIN=auto GOFLAGS=-buildvcs=false
            kldload pf 2>/dev/null || true   # pfctl(8) of FreeBSD 15 talks to the kernel through netlink: the module must be loaded
            go version
            if [ "$PART" != go ]; then
              JAILOPS_E2E_PART="$PART" JAILOPS_BIN_DIR="$PWD/vm-bin" FORGE_BIN="$PWD/vm-bin/forge-freebsd-amd64" sh scripts/ci-freebsd-e2e.sh
              exit
            fi
            # the Go tests need a PostgreSQL (embedded-postgres has no FreeBSD build): start the packaged one
            sysrc postgresql_enable=YES >/dev/null
            service postgresql oneinitdb >/dev/null 2>&1 || true
            service postgresql onestart
            n=0; until su -m postgres -c "psql -c 'select 1'" >/dev/null 2>&1; do n=$((n + 1)); [ $n -gt 30 ] && { echo "postgresql does not answer"; exit 1; }; sleep 1; done
            export JAILOPS_TEST_DATABASE_URL="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
            go test ./... -count=1   # go vet runs in the cross-build job on the same GOOS and files
