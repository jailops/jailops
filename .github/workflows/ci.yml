name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The consoles are embedded in the binaries, so they are built first and handed to the Go jobs. Only the build blocks
  # them: the type checks, the unit tests and the Playwright tests run beside the Go jobs in web-test.
  web-build:
    name: Web consoles (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build both consoles
        run: |
          cd web
          npm ci
          npm run build:all
      # one tar file: with several paths upload-artifact roots them at their common parent, and they would unpack to
      # webui/dist instead of internal/webui/dist
      - name: Pack the built consoles
        run: tar -cf "$RUNNER_TEMP/console-dist.tar" internal/webui/dist internal/backupui/dist
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: ${{ runner.temp }}/console-dist.tar
          compression-level: 0
          retention-days: 7

  web-test:
    name: Web consoles (types, unit tests, end-to-end)
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the end-to-end tests run `vite preview` on the built consoles (web/host/playwright.config.ts: "build first")
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Wire types are current
        run: go run ./scripts/gen-ts -check
      - name: Install, typecheck, unit tests
        run: |
          cd web
          npm ci
          npm run typecheck
          npm run test:all
      - name: End-to-end tests (demo mode, real Chromium)
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run e2e:all

  lint:
    name: Go (format, vet, build, SDK, fuzz)
    needs: web-build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal sdk scripts)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: The race shards cover every package exactly once
        run: bash scripts/ci-race.sh --check
      - name: SDK module (stdlib only, outside the go.work workspace so that only its own go.mod counts)
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          CGO_ENABLED=1 go test ./... -race -count=1
          test -z "$(go list -m all | tail -n +2)" || { echo "the SDK must have no dependencies"; go list -m all; exit 1; }
      - name: Fuzz the parsers briefly (go allows one fuzz target per run)
        run: |
          for f in $(go test ./internal/sys/zfs -list '^Fuzz' | grep '^Fuzz'); do
            go test ./internal/sys/zfs -run '^$' -fuzz "^${f}\$" -fuzztime 5s
          done
      - name: Fuzz the helper's command allow-list briefly
        run: go test ./internal/priv -run '^$' -fuzz '^FuzzCheckCommand$' -fuzztime 20s

  # The tests with the race detector, in four parallel shards (scripts/ci-race.sh: split by measured run time).
  race:
    name: Go race detector (${{ matrix.shard }})
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, rest]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JAILOPS_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: go test -race (shard ${{ matrix.shard }})
        run: bash scripts/ci-race.sh ${{ matrix.shard }}

  cross:
    name: Cross-build (FreeBSD)
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: freebsd
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - run: go build ./...
      - run: go vet ./...
      - name: Binaries
        run: |
          mkdir -p dist
          for b in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            go build -trimpath -ldflags="-s -w -X main.version=$(tr -d '[:space:]' < version.txt)" -o dist/$b-freebsd-${{ matrix.arch }} ./cmd/$b
          done
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.arch }}
          path: dist
          retention-days: 7

  # The tests on the real target. A FreeBSD VM runs the unit tests natively (pty, jail(2), sysctl and the other
  # FreeBSD-only code paths execute here, not just compile) and then the scripted end-to-end flow on a file-backed
  # ZFS pool: image build, jail create/start/exec, backup to a node and restore.
  freebsd:
    name: FreeBSD VM
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y go git-lite postgresql17-server bash curl rsync
          run: |
            set -eu
            export CGO_ENABLED=0 GOTOOLCHAIN=auto   # go.mod names a newer Go than the package: fetch it
            go version
            # the Go tests need a PostgreSQL (embedded-postgres has no FreeBSD build): start the packaged one
            sysrc postgresql_enable=YES >/dev/null
            service postgresql oneinitdb >/dev/null 2>&1 || true
            service postgresql onestart
            n=0; until su -m postgres -c "psql -c 'select 1'" >/dev/null 2>&1; do n=$((n + 1)); [ $n -gt 30 ] && { echo "postgresql does not answer"; exit 1; }; sleep 1; done
            export JAILOPS_TEST_DATABASE_URL="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
            go vet ./...
            go test ./... -count=1
            sh scripts/ci-freebsd-e2e.sh
