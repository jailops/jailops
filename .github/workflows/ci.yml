name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The same suite every night with longer fuzzing: the parsers get minutes, not seconds.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# the Go jobs always get the built consoles: a test fails when one is missing from the binary
env:
  JAILOPS_REQUIRE_CONSOLE: "1"
  # the next entry is tried after ANY error of the module proxy, not only after a 404: a stream error of proxy.golang.org failed a run
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release commit changes version.txt and CHANGELOG.md and nothing else: the tree it comes from passed this workflow already on its
  # parent. When the change is only those two files and the tree of the parent has a green run (the run of the parent itself, or of any
  # commit with the same tree: a squash merge is a new commit of the tree its pull request ran), the slow jobs (the race detector, the
  # fuzzers, the browsers and the FreeBSD VMs) are skipped, so a release PR and the push of its merge take minutes. Anything else runs
  # everything, docs included: tests and the prose lint read the docs.
  # `just release` still asks for a green run of exactly the commit it tags: the jobs that run here make it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_only: ${{ steps.c.outputs.release_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          only=false
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ] && [ -z "$(printf '%s\n' "$files" | grep -v -x -e version.txt -e CHANGELOG.md || true)" ]; then
              parent=$(git rev-parse HEAD^1)
              tree=$(git rev-parse "$parent^{tree}")
              green=0
              for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --status success --limit 40 --json headSha --jq '.[].headSha' | sort -u); do
                if [ "$sha" = "$parent" ]; then green=$sha; break; fi
                t=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.tree.sha 2>/dev/null || true)
                if [ "$t" = "$tree" ]; then green=$sha; break; fi
              done
              if [ "$green" != 0 ]; then only=true; fi
              echo "only version.txt and CHANGELOG.md changed; the tree of the parent ${parent} is green in the run of: ${green}"
            fi
          fi
          echo "release_only=$only" >> "$GITHUB_OUTPUT"

  # The consoles are embedded in the binaries, so they are built first and handed to the Go jobs. Only the build blocks
  # them: the type checks, the unit tests and the Playwright tests run beside the Go jobs in web-test and web-e2e.
  web-build:
    name: Web consoles (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build both consoles
        run: |
          cd web
          npm ci
          npm run build:all
      # one tar file: with several paths upload-artifact roots them at their common parent, and they would unpack to
      # webui/dist instead of internal/webui/dist
      - name: Pack the built consoles
        run: tar -cf "$RUNNER_TEMP/console-dist.tar" internal/webui/dist internal/backupui/dist
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: ${{ runner.temp }}/console-dist.tar
          compression-level: 0
          retention-days: 7

  web-test:
    name: Web consoles (types, unit tests)
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, unit tests
        run: |
          cd web
          npm ci
          npm run typecheck
          npm run test:all

  # The end-to-end tests of the consoles in a real Chromium, in demo mode. Playwright installs the browser with its system
  # libraries and fonts (apt), with a quick mirror, retries and the downloaded packages kept between runs.
  web-e2e:
    name: Web consoles (end-to-end, Chromium)
    needs: [web-build, changes]
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the end-to-end tests build a demo of each console (JAILOPS_DEMO_BUILD=1) and serve it with `vite preview`
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      # The runner's apt mirror (azure.archive.ubuntu.com) is sometimes served by a node that trickles at tens of KB/s for
      # hours (actions/runner-images#14823): apt's own timeout only covers a stalled connection, never a slow one. So four
      # trustworthy mirrors (Canonical's three and kernel.org's edge mirror, all serving Ubuntu-signed indexes) download the
      # package index for 5 seconds at once, and the list apt reads is rewritten in speed order with every mirror kept as a
      # fallback: a download that stalls for 10 seconds is dropped and apt moves to the next mirror; failed downloads are
      # retried. The retry file keeps the image's own name, as apt.conf.d files sort and the later one wins. Every mirror is
      # named with https (apt checks the signed indexes either way; a mirror that does not answer https ranks last).
      - name: Fastest apt mirror, retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/zz-retries >/dev/null
          sudo chown -R "$USER" /var/cache/apt/archives
          list=/etc/apt/apt-mirrors.txt
          [ -f "$list" ] || exit 0
          . /etc/os-release
          mirrors="https://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://security.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/"
          speeds=$(mktemp)
          for m in $mirrors; do
            curl -sf -o /dev/null --max-time 5 -w "%{speed_download} $m\n" "${m}dists/$VERSION_CODENAME/main/binary-amd64/Packages.gz" >>"$speeds" &
          done
          wait
          sort -rn "$speeds" | awk '{ printf "%6d KB/s  %s\n", $1 / 1024, $2 }'
          grep -qv '^0' "$speeds" || exit 0
          sort -rn "$speeds" | awk '{ printf "%s\tpriority:%d\n", $2, NR }' | sudo tee "$list" >/dev/null
      # Only the packages, not the directory: apt leaves `lock` (root, 0640) and `partial/` in it, tar cannot read them, the save failed
      # with exit code 2 and so the cache never existed: every run downloaded Chromium and its libraries again.
      - name: Cache the apt packages and the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1-${{ hashFiles('web/package-lock.json') }}
      - name: Chromium and its system libraries and fonts
        run: cd web && npx playwright install --with-deps chromium
      - name: End-to-end tests (demo mode, real Chromium)
        run: cd web && npm run e2e:all

  lint:
    name: Go (format, vet, build, types, SDK)
    needs: web-build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - name: Fetch the Go modules
        uses: ./.github/actions/go-modules
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: No binaries in git
        run: sh scripts/no-binaries.sh
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal sdk scripts)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Every command takes its version from -X main.version (a command without it ships as "dev")
        run: |
          for d in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            grep -q '^var version = ' "cmd/$d/main.go" || { echo "cmd/$d/main.go has no 'var version': the release stamp would not reach it"; exit 1; }
          done
      - run: go vet ./...
      - run: go build ./...
      - name: Wire types are current
        run: go run ./scripts/gen-ts -check
      - name: The end-to-end scripts wait for conditions, not for seconds
        run: sh scripts/lint-e2e.sh
      - name: Prose carries no history, test diary or filler
        run: sh scripts/lint-prose.sh
      - name: The lock of the FreeBSD test VMs serializes two runs
        run: sh scripts/vm-lock-test.sh
      - name: The workflow walkthrough agrees with its steps and the roadmap
        run: |
          sh scripts/check-workflows-table.sh
          sh test/workflows/check-test.sh
      - name: The race shards cover every package exactly once
        run: bash scripts/ci-race.sh --check
      - name: SDK module (stdlib only, outside the go.work workspace so that only its own go.mod counts)
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          CGO_ENABLED=1 go test ./... -race -count=1
          test -z "$(go list -m all | tail -n +2)" || { echo "the SDK must have no dependencies"; go list -m all; exit 1; }
      - name: jailops-setup (the installer script, against fake pfctl, sysrc, zpool and service)
        run: |
          sh scripts/jailops-setup-test.sh
          command -v dash >/dev/null && SH=dash sh scripts/jailops-setup-test.sh || true

  # Fuzzing beside the other Go jobs (go allows one fuzz target per run; longer on the nightly run).
  fuzz:
    name: Go fuzz
    needs: [web-build, changes]
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - name: Fetch the Go modules
        uses: ./.github/actions/go-modules
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: Fuzz the parsers
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '90s' || '5s' }}
        run: |
          for f in $(go test ./internal/sys/zfs -list '^Fuzz' | grep '^Fuzz'); do
            go test ./internal/sys/zfs -run '^$' -fuzz "^${f}\$" -fuzztime "$FUZZ_TIME"
          done
      - name: Fuzz the helper's command allow-list
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '5m' || '20s' }}
        run: go test ./internal/priv -run '^$' -fuzz '^FuzzCheckCommand$' -fuzztime "$FUZZ_TIME"

  # The tests with the race detector, in four parallel shards (scripts/ci-race.sh: split by measured run time).
  race:
    name: Go race detector (${{ matrix.shard }})
    needs: [web-build, changes]
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, rest]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JAILOPS_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - name: Fetch the Go modules
        uses: ./.github/actions/go-modules
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - name: go test -race (shard ${{ matrix.shard }})
        run: bash scripts/ci-race.sh ${{ matrix.shard }}

  cross:
    name: Cross-build (FreeBSD)
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: freebsd
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - name: Fetch the Go modules
        uses: ./.github/actions/go-modules
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      - run: go vet ./...   # compiles everything, so no separate go build
      - name: Binaries
        run: |
          mkdir -p dist
          for b in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            go build -trimpath -ldflags="-s -w -X main.version=$(tr -d '[:space:]' < version.txt)" -o dist/$b-freebsd-${{ matrix.arch }} ./cmd/$b
          done
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.arch }}
          path: dist
          retention-days: 7

  # The tests on the real target. A FreeBSD VM runs the unit tests natively (pty, jail(2), sysctl and the other
  # FreeBSD-only code paths execute here, not just compile) and then the scripted end-to-end flow on a file-backed
  # ZFS pool: image build, jail create/start/exec, backup to a node and restore.
  # Three VMs side by side: the Go tests on real FreeBSD, the product end to end, and the packet filter test with real
  # traffic (scripts/ci-freebsd-e2e.sh, JAILOPS_E2E_PART). They do not depend on each other, so the run takes the
  # longest one, not the sum.
  freebsd:
    name: FreeBSD VM (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: [web-build, changes]
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    # the slowest part takes seventeen minutes: a VM that hangs (an unreachable package mirror kept one for thirty) ends at forty
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # the end-to-end flow and the packet filter test are linear scripts that took twenty minutes each: they run in shards on VMs of
        # their own (scripts/ci-freebsd-e2e.sh JAILOPS_E2E_SHARD, scripts/ci-freebsd-pf.sh PF_SHARD), each set up the same way
        # pkgs: what the VM of the part needs on top of its image, nothing else. The image brings rsync (the action's own file sync runs
        # on it) and no curl. The e2e and pf VMs run the binaries built above, the scripts use curl on the host (the jails get their
        # packages through the helper), and only the backup node step of e2e shard 2 and the Go tests use a PostgreSQL on the host.
        include:
          - part: go
            pkgs: go git-lite postgresql17-server bash curl
          - part: e2e
            shard: "1"
            pkgs: curl
          - part: e2e
            shard: "2"
            pkgs: curl postgresql17-server
          - part: e2e
            shard: "3"
            pkgs: curl
          - part: pf
            shard: a
            pkgs: curl
          - part: pf
            shard: b
            pkgs: curl
          - part: pf
            shard: c
            pkgs: curl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: ${{ runner.temp }}/console
      - name: Unpack the built consoles
        run: tar -xf "$RUNNER_TEMP/console/console-dist.tar"
      # The e2e and pf VMs get the binaries built here (cross-compiled in about a minute) instead of building them inside the VM, and
      # the forged-frame tool for phase 0e of the PF matrix.
      - uses: actions/setup-go@v7
        if: matrix.part != 'go'
        with:
          go-version-file: go.mod
          cache: false
      # One Go build cache per job (and shard, architecture or part): setup-go's own cache has one key for all of them, so the first
      # job to finish saved its flavour (race, freebsd, trimpath ...) and the others restored a cache of no use to them.
      - name: Go build cache of this job
        if: matrix.part != 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ github.job }}-${{ matrix.shard }}${{ matrix.arch }}${{ matrix.part }}-
      - name: Fetch the Go modules
        if: matrix.part != 'go'
        uses: ./.github/actions/go-modules
      - name: Build the binaries for the e2e VM
        if: matrix.part != 'go'
        env:
          CGO_ENABLED: "0"
          GOOS: freebsd
          GOARCH: amd64
        run: |
          mkdir -p vm-bin
          for b in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            go build -trimpath -ldflags="-s -w -X main.version=$(tr -d '[:space:]' < version.txt)" -o vm-bin/$b-freebsd-amd64 ./cmd/$b
          done
          go build -o vm-bin/forge-freebsd-amd64 ./scripts/forge
      - name: KVM must be there (without it QEMU falls back to software emulation, which is far too slow)
        run: |
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner: the VM would run on TCG"; exit 1; }
          nproc; ls -l /dev/kvm
      - uses: vmactions/freebsd-vm@v1
        env:
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
        with:
          envs: PART SHARD JAILOPS_REQUIRE_CONSOLE GOPROXY
          cache-after-prepare: true
          release: "15.1"
          usesh: true
          sync: rsync
          # One unreachable mirror must not cost the job its half hour (a run waited on `No route to host` for every catalogue): what the
          # part needs is looked for in the image first and the mirror is read only for what is missing; the VM's network has no IPv6
          # route, fetches are bounded, only the ports repository is read (the kmods and base catalogues are not needed and are two more
          # requests), and the install is tried three times with the catalogue fetched again between the tries. The prepared image is
          # cached (cache-after-prepare), so a run with the same text of this step does not come here at all. A failure that ends in the
          # line "did not give ... in three attempts" is run once more by .github/workflows/ci-rerun-mirror.yml.
          prepare: |
            set -u
            have() {
              case "$1" in
              postgresql17-server) [ -x /usr/local/bin/postgres ] ;;
              git-lite) command -v git >/dev/null ;;
              *) command -v "$1" >/dev/null ;;
              esac
            }
            want=""
            for p in ${{ matrix.pkgs }}; do have "$p" || want="$want $p"; done
            if [ -z "$want" ]; then echo "the image has ${{ matrix.pkgs }}: nothing to install"; exit 0; fi
            mkdir -p /usr/local/etc/pkg/repos
            printf '%s\n' 'IP_VERSION = 4;' 'FETCH_TIMEOUT = 30;' 'FETCH_RETRY = 3;' > /usr/local/etc/pkg.conf
            printf '%s\n' 'FreeBSD-ports-kmods: { enabled: no }' 'FreeBSD-base: { enabled: no }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            export ASSUME_ALWAYS_YES=yes
            # curl is 6 MiB with what it needs; a PostgreSQL server brings its compiler runtime (some 380 MiB to download, 2 GiB to unpack)
            case "$want" in *postgresql17-server*) limit=420 ;; *) limit=120 ;; esac
            n=0; ok=no
            while [ "$n" -lt 3 ]; do
              n=$((n + 1))
              # shellcheck disable=SC2086
              if timeout "$limit" pkg install -y -r FreeBSD-ports $want; then ok=yes; break; fi
              echo "pkg install of$want failed (attempt $n of 3)"
              sleep $((n * 15))
              timeout 120 pkg update -f -r FreeBSD-ports || true
            done
            [ "$ok" = yes ] || { echo "the package mirror (pkg.FreeBSD.org, FreeBSD-ports, quarterly) did not give$want in three attempts"; exit 1; }
          run: |
            set -eu
            # go.mod names a newer Go than the package: fetch it; the tests that build binaries must not ask git for a
            # VCS stamp (the synced tree is not a clone)
            export CGO_ENABLED=0 GOTOOLCHAIN=auto GOFLAGS=-buildvcs=false
            kldload pf 2>/dev/null || true   # pfctl(8) of FreeBSD 15 talks to the kernel through netlink: the module must be loaded
            if [ "$PART" != go ]; then
              e2e_shard=all; pf_shard=all
              [ "$PART" = e2e ] && e2e_shard="$SHARD"
              [ "$PART" = pf ] && pf_shard="$SHARD"
              JAILOPS_E2E_PART="$PART" JAILOPS_E2E_SHARD="$e2e_shard" JAILOPS_PF_SHARD="$pf_shard" JAILOPS_BIN_DIR="$PWD/vm-bin" FORGE_BIN="$PWD/vm-bin/forge-freebsd-amd64" sh scripts/ci-freebsd-e2e.sh
              exit
            fi
            go version
            # the Go tests need a PostgreSQL (embedded-postgres has no FreeBSD build): start the packaged one
            sysrc postgresql_enable=YES >/dev/null
            service postgresql oneinitdb >/dev/null 2>&1 || true
            service postgresql onestart
            n=0; until su -m postgres -c "psql -c 'select 1'" >/dev/null 2>&1; do n=$((n + 1)); [ $n -gt 30 ] && { echo "postgresql does not answer"; exit 1; }; sleep 1; done
            export JAILOPS_TEST_DATABASE_URL="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
            n=0; until go mod download; do n=$((n + 1)); [ $n -ge 3 ] && exit 1; echo "go mod download failed (attempt $n of 3)"; sleep $((n * 10)); done
            go test ./... -count=1   # go vet runs in the cross-build job on the same GOOS and files

  # One name for the whole workflow: green when every job passed or was skipped on purpose (a release-only change).
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, web-build, web-test, web-e2e, lint, fuzz, race, cross, freebsd]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          [ "$CHANGES" = success ] || { echo "the change detection did not run"; exit 1; }
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
