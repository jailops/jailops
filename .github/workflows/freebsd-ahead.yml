name: FreeBSD ahead

# Every Sunday and on demand: the end-to-end and the packet filter parts on the FreeBSD that is not the gate. The gate is a RELEASE (15.1, in
# ci.yml). This workflow looks at what comes after it: the snapshot of stable/15 (15.2 before it is released) and 16.0-CURRENT. It is
# not part of `CI ok`, runs on no pull request and blocks nothing: a red run is news to read.
#
# The action of ci.yml (vmactions/freebsd-vm) runs releases only, so the VM is started here with qemu and KVM from the official snapshot
# image (scripts/ci-boot-vm.sh: download, sha256, a NoCloud seed that gives root the ssh key, the wait for ssh). The VM is brought to the
# newest packages of its branch, gets what the parts need, and scripts/ci-ahead-run.sh runs the parts one after the other, each from a
# clean state, and writes a table (part, result, minutes, the first failing lines) to the summary of the run; the logs are an artifact.
# A VM that cannot be booted, updated or given its packages is written as "environment" and is no failure of the tree.
#
#   gh workflow run freebsd-ahead.yml                      both branches
#   gh workflow run freebsd-ahead.yml -f which=current     one branch (stable, current)
#   gh workflow run freebsd-ahead.yml -f fail_fast=true    end the run at the first red job

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      which:
        description: "The branch to run"
        type: choice
        options: [both, stable, current]
        default: both
      fail_fast:
        description: "End the run at the first job that fails"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: freebsd-ahead
  cancel-in-progress: false

env:
  JAILOPS_REQUIRE_CONSOLE: "1"
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # the jobs: a branch is a VM image, and the parts are shared among three VMs per branch so that none runs longer than about an hour
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          WHICH: ${{ inputs.which }}
        run: |
          which=${WHICH:-both}
          jq -nc --arg which "$which" '
            [ {branch: "stable", version: "15.2-STABLE", port: 2240}, {branch: "current", version: "16.0-CURRENT", port: 2241} ]
            | map(select($which == "both" or .branch == $which))
            | map(. as $b | [
                {group: "e2e",   parts: "e2e:1 e2e:2 e2e:3", pkgs: "curl postgresql17-server"},
                {group: "pf-ab", parts: "pf:a pf:b",         pkgs: "curl"},
                {group: "pf-cd", parts: "pf:c pf:d",         pkgs: "curl"}
              ] | map($b + .))
            | add' > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          cat matrix.json

  # the binaries of the tree for FreeBSD, with the consoles embedded: built once, copied into every VM
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build both consoles
        run: |
          cd web
          npm ci
          npm run build:all
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch the Go modules
        uses: ./.github/actions/go-modules
      - name: Build the binaries for the VMs
        env:
          CGO_ENABLED: "0"
          GOOS: freebsd
          GOARCH: amd64
        run: |
          mkdir -p vm-bin
          for b in jailops jailopsd jailops-priv jailops-sync jailops-backupd; do
            go build -trimpath -ldflags="-s -w -X main.version=$(tr -d '[:space:]' < version.txt)" -o vm-bin/$b-freebsd-amd64 ./cmd/$b
          done
          go build -o vm-bin/forge-freebsd-amd64 ./scripts/forge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ahead-bin
          path: vm-bin
          compression-level: 0
          retention-days: 3

  ahead:
    name: ${{ matrix.branch }} ${{ matrix.group }} (${{ matrix.version }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    # two end-to-end shards and a packet filter shard take about an hour; the VM and its download come on top
    timeout-minutes: 150
    strategy:
      fail-fast: ${{ inputs.fail_fast == true }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ahead-bin
          path: vm-bin
      - name: Packages of the runner for qemu, the seed and the image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf xz-utils python3-venv openssh-client curl
      - name: KVM must be there (without it QEMU falls back to software emulation, which is far too slow)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner: the VM would run on TCG"; exit 1; }
          nproc; ls -l /dev/kvm
      - name: A key for the VM
        run: ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/vmkey"
      - name: Download the snapshot and boot it
        id: boot
        continue-on-error: true
        run: |
          set -eu
          sh scripts/ci-boot-vm.sh fetch "${{ matrix.version }}" "$RUNNER_TEMP/vm"
          QEMU_SMP=3 QEMU_MEM=8G sh scripts/ci-boot-vm.sh boot "$RUNNER_TEMP/vm" "${{ matrix.port }}" "$RUNNER_TEMP/vmkey"
      - name: The VM could not be booted
        if: steps.boot.outcome == 'failure'
        run: |
          echo "::warning::environment: the snapshot of ${{ matrix.version }} did not download or boot, nothing was tested"
          {
            echo "### ${{ matrix.version }} ${{ matrix.group }}"
            echo ""
            echo "environment: the snapshot did not download or boot, so nothing was tested (not a failure of the tree)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the parts (${{ matrix.parts }})
        if: steps.boot.outcome == 'success'
        run: |
          BIN_DIR=vm-bin sh scripts/ci-ahead-run.sh "${{ matrix.port }}" "$RUNNER_TEMP/vmkey" "$RUNNER_TEMP/out" "${{ matrix.parts }}" ${{ matrix.pkgs }}
      - name: Logs of the parts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ahead-${{ matrix.branch }}-${{ matrix.group }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the VM
        if: always()
        run: sh scripts/ci-boot-vm.sh stop "$RUNNER_TEMP/vm"
