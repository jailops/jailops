# One grouped pull request per ecosystem and week instead of one per dependency. Major versions are left to a person
# (they can break the wire types, the embedded web consoles or the go.work setup), security updates still arrive on their own.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: gomod
    directory: /sdk
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      sdk-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - { dependency-name: "*", update-types: ["version-update:semver-major"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
